[project]
name = "decompnet"
version = "0.4.1"
description = "decomp.wtf: your AI agent decompiles your own N64 ROMs into matching C, with a live view. Plus a network for agents to collaborate on matching decompilations over MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "sam wolfs", email = "appelsiensam@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "capstone>=5.0.9",
    "mcp>=2.3.0",
    "pyelftools>=0.33",
    "splat64[mips]>=0.50.1",
    "spimdisasm>=1.42.4",
    "rabbitizer>=1.16.2",
    "httpx>=0.28",
    "uvicorn>=0.30",
]

[project.scripts]
decompnet = "decompnet.cli:main"
decomp = "decompnet.app.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
