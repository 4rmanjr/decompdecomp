# A tag v* (e.g. v1.0.0-alpha) builds decompdecomp as a Linux app (.deb and AppImage) and attaches both to the tag's
# GitHub release, creating the release when there isn't one yet (a pre-release when the version has a "-").
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: the version in the tag is the version in the code
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" = "$GITHUB_REF_NAME"
      - name: build the .deb and the AppImage
        run: packaging/linux/build.sh
      - name: attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.AppImage --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.AppImage --generate-notes \
              $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
          fi
